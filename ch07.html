<script>window.QUIZ = { key: "CH07", questions: [{"q": "What is an archive in the context of this chapter?", "o": ["A backup that is stored only on tape", "One file that combines many files", "A directory that is synchronized with rsync", "A compressed copy of one file only"], "a": 1, "e": "Archive 是將多個檔案與目錄合併成一個單一檔案，可為一般檔案或裝置檔 (如磁帶機、隨身碟)。", "s": 4}, {"q": "What does the name tar stand for?", "o": ["Tape ARchive", "Tar Archive Repository", "Transfer And Restore", "Text ARchive"], "a": 0, "e": "Linux 標準封存工具 tar 的全名為 Tape ARchive。", "s": 4}, {"q": "Which statement about zip on RHEL is correct according to the course?", "o": ["zip is the only archiving tool that RHEL supports for creating archives", "RHEL supports zip, but tar is the common Linux archiving command", "zip is required to create .tar.gz files, and tar only adds files to them", "tar cannot create compressed archives, so zip must be used instead"], "a": 1, "e": "RHEL 也支援 zip／unzip (PKZIP 演算法)，但在 Linux 上建立、管理與解壓縮 Archive 的常用指令是 tar。", "s": 4}, {"q": "Which tar option creates a new archive?", "o": ["-x", "-t", "-a", "-c"], "a": 3, "e": "tar 的三種操作模式三選一：-c 建立、-t 列出、-x 解壓縮。", "s": 5}, {"q": "Which tar option lists the contents of an archive?", "o": ["-l", "-t", "-v", "-c"], "a": 1, "e": "-t (--list) 列出 Archive 內的檔案清單。", "s": 5}, {"q": "Which tar option specifies the archive file name and must be followed directly by that name?", "o": ["-v", "-a", "-f", "-p"], "a": 2, "e": "-f 指定 Archive 檔案名稱且必須緊接檔名，例如 tar -cvf archive.tar /dir。", "s": 5}, {"q": "Which tar compression option uses gzip?", "o": ["-g", "-z", "-j", "-J"], "a": 1, "e": "-z 為 gzip (.tar.gz)、-j 為 bzip2 (.tar.bz2)、-J 為 xz (.tar.xz)。", "s": 5}, {"q": "Which tar compression option produces a .tar.xz archive?", "o": ["-J", "-z", "-x", "-j"], "a": 0, "e": "-J (大寫) 為 xz，壓縮比最佳但速度最慢；小寫 -j 為 bzip2，-x 為解壓縮。", "s": 5}, {"q": "Which tar option automatically chooses the compression method from the archive file extension?", "o": ["-a", "-C", "-A", "-z"], "a": 0, "e": "-a (--auto-compress) 依副檔名自動選擇壓縮方式。", "s": 5}, {"q": "Which command archives the /etc directory into /root/etc.tar and shows each file being archived?", "o": ["tar -xvf /root/etc.tar /etc", "tar -tvf /etc /root/etc.tar", "tar -cvf /root/etc.tar /etc", "tar -cf /etc /root/etc.tar -v"], "a": 2, "e": "-c 建立、-v 顯示清單、-f 後接 Archive 檔名，最後是來源目錄。", "s": 8}, {"q": "What does tar display when it successfully creates an archive without the -v option?", "o": ["The archive size", "A list of all archived files", "A summary of the number of files", "Nothing; it returns to the shell prompt"], "a": 3, "e": "沒有 -v 時 tar 不會列出檔案名稱，成功完成後直接回到命令提示字元。", "s": 8}, {"q": "What happens if you create an archive with the same name as an existing archive?", "o": ["tar appends the new files to it", "tar renames the old archive with a .bak suffix", "The existing archive is overwritten", "tar refuses and exits with an error"], "a": 2, "e": "若同名 Archive 已存在會被覆蓋；此外使用者必須對來源檔案有讀取權限，封存 /etc 通常需要 root。", "s": 8}, {"q": "Which command archives the current directory into /tmp/current.tar?", "o": ["tar -cf . /tmp/current.tar", "tar -xf /tmp/current.tar .", "tar -tf /tmp/current.tar .", "tar -cf /tmp/current.tar ."], "a": 3, "e": ". 代表當前目錄，tar -cf /tmp/current.tar . 將目前目錄封存。", "s": 8}, {"q": "What does tar do by default with the leading / of absolute paths when it creates an archive?", "o": ["It refuses to archive any file that is given with an absolute path", "It removes the leading / so that members are stored with relative paths", "It keeps the absolute paths so that files restore to their original location", "It replaces the leading / with the name of the user who created the archive"], "a": 1, "e": "tar 建立時自動移除開頭 /，解壓縮時因此不會直接覆蓋系統原始目錄 (如 /etc)。", "s": 9}, {"q": "Which tar option keeps absolute paths in an archive, and why is it discouraged?", "o": ["-p, because it changes the permissions of every extracted file", "-P, because extracting the archive might overwrite system files", "-A, because it removes the ACLs from all archived files", "--selinux, because it disables SELinux while extracting"], "a": 1, "e": "-P 保留絕對路徑，但解壓縮時可能覆蓋系統檔案，極度危險，不建議使用。", "s": 9}, {"q": "Which tar option saves SELinux file contexts in the archive?", "o": ["--context", "--selinux", "-Z", "--xattrs-only"], "a": 1, "e": "--selinux 保留 SELinux file context，預設不會保存。", "s": 9}, {"q": "Which tar option preserves POSIX ACLs that were set with setfacl?", "o": ["--selinux", "-A only when extracting", "--acls", "--perms"], "a": 2, "e": "--acls 保留 POSIX ACL (存取控制清單)。", "s": 9}, {"q": "Which tar option preserves other extended attributes that are not saved by default?", "o": ["-p", "-v", "--xattrs", "--acls"], "a": 2, "e": "--xattrs 保留其他延伸屬性，預設不會保存。", "s": 9}, {"q": "What is the recommended practice before restoring an archive into system directories?", "o": ["Extract it directly into / so that files return to their original paths", "Delete the target directory first so that no old files remain", "Extract it to a temporary directory and check the contents manually", "Always add -P so that the absolute paths are preserved exactly"], "a": 2, "e": "建議解壓縮到暫存目錄後再手動確認內容。", "s": 9}, {"q": "Which command lists the contents of /root/etc.tar with permissions, owner, size, and date?", "o": ["tar -xvf /root/etc.tar", "ls -l /root/etc.tar", "tar -tf /root/etc.tar", "tar -tvf /root/etc.tar"], "a": 3, "e": "-t 搭配 -v 顯示詳細資訊：權限、擁有者／群組、大小、修改日期與路徑。", "s": 10}, {"q": "Why is tar -t useful before extracting an archive from an unknown source?", "o": ["It verifies the digital signature of the archive before extracting it", "It removes dangerous files from the archive before you extract it", "It extracts the archive in read-only mode so that nothing is overwritten", "It reads the file list without extracting anything"], "a": 3, "e": "-t 不會解壓縮，只讀取目錄資訊、速度快，適合在解壓縮前先確認內容。", "s": 10}, {"q": "In the tar -tvf output, what does root/root represent?", "o": ["The SELinux user and role", "The user who created and extracted the archive", "The source and destination directories", "The owner and group of the file"], "a": 3, "e": "root/root 欄位為擁有者／群組。", "s": 10}, {"q": "Which command extracts /root/etc.tar into /tmp/restore?", "o": ["tar -xf /root/etc.tar > /tmp/restore", "tar -xf /tmp/restore /root/etc.tar", "tar -cf /root/etc.tar -C /tmp/restore", "tar -xf /root/etc.tar -C /tmp/restore"], "a": 3, "e": "-C 指定解壓縮的目標目錄。", "s": 11}, {"q": "Before running tar -xf archive.tar -C /tmp/restore, what must be true?", "o": ["The archive must be compressed, because -C works only with -z or -j", "/tmp/restore must be empty and owned by root before extraction", "SELinux must be in permissive mode to extract to another directory", "The /tmp/restore directory must already exist, because tar does not create it"], "a": 3, "e": "tar 不會自動建立 -C 指定的目錄，需先以 mkdir -p /tmp/restore 建立。", "s": 11}, {"q": "Which command extracts only the files under etc/ssh/ from archive.tar?", "o": ["tar -xf archive.tar /etc/ssh", "tar -xf archive.tar -C etc/ssh", "tar -tf archive.tar 'etc/ssh/*'", "tar -xf archive.tar --wildcards 'etc/ssh/*'"], "a": 3, "e": "--wildcards 可只解壓縮符合 Pattern 的檔案；也可直接指定成員名稱如 etc/hosts。", "s": 11}, {"q": "Who owns the extracted files when a regular user extracts an archive?", "o": ["The user who extracts the archive", "nobody", "The original owner stored in the archive", "root"], "a": 0, "e": "root 解壓縮會保留原擁有者，一般使用者解壓縮則成為檔案擁有者。", "s": 11}, {"q": "When extracting with tar as a regular user, what affects the permissions unless -p is used?", "o": ["The SELinux mode", "The PATH variable", "The archive compression method", "The user's umask"], "a": 3, "e": "-p 保留原始權限 (root 預設啟用)；否則權限受 umask 影響。", "s": 11}, {"q": "Which command creates a bzip2-compressed archive?", "o": ["tar -cbf archive.tar.bz2 /source", "tar -cJf archive.tar.bz2 /source", "tar -czf archive.tar.bz2 /source", "tar -cjf archive.tar.bz2 /source"], "a": 3, "e": "-j 對應 bzip2，副檔名為 .tar.bz2。", "s": 13}, {"q": "What compression does tar -caf mybackup.tar.xz /etc use?", "o": ["xz, selected automatically from the .tar.xz extension", "gzip, because gzip is always the default compression", "No compression, because -a only works when extracting", "bzip2, because -a selects the best compression ratio"], "a": 0, "e": "-a 依副檔名自動選擇壓縮方式，.tar.xz 使用 xz，.tar.gz 使用 gzip。", "s": 13}, {"q": "Which compression algorithm gives the best compression ratio but is the slowest?", "o": ["xz", "bzip2", "No compression", "gzip"], "a": 0, "e": "比較表中 xz 較新、壓縮比最佳但速度最慢；gzip 最早、最快且相容性最好。", "s": 14}, {"q": "Which compression algorithm is the oldest, fastest, and most widely supported across platforms?", "o": ["zstd", "bzip2", "gzip", "xz"], "a": 2, "e": "gzip 最早、最快，跨平台廣泛支援。", "s": 14}, {"q": "In the lab measurement of the 22 MB /etc directory, how much space did xz save?", "o": ["75%", "50%", "79%", "81%"], "a": 3, "e": "實測 gzip 節省 75%、bzip2 節省 79%、xz 節省 81%。", "s": 14}, {"q": "Do you need to specify -z, -j, or -J to extract a compressed archive with modern tar?", "o": ["Only for xz archives", "No; tar detects the format automatically", "Only for gzip archives", "Yes; extraction fails without the correct option"], "a": 1, "e": "現代 tar 能自動判斷 Archive 的壓縮格式，解壓縮時不需明確指定 -z、-j 或 -J。", "s": 15}, {"q": "What error do you get when you run tar -xzf archive.tar.bz2?", "o": ["bzip2: unknown option -z", "tar: archive is empty", "gzip: stdin: not in gzip format", "Permission denied"], "a": 2, "e": "用 -z (gzip) 解壓 bzip2 的 Archive 會出現 gzip: stdin: not in gzip format；改用 -j 或直接 -xf。", "s": 15}, {"q": "What happens to logfile.txt after you run gzip logfile.txt?", "o": ["Nothing changes until gunzip is run", "logfile.txt is archived into logfile.tar", "logfile.txt.gz is created and the original file is removed", "logfile.txt.gz is created and the original file is kept"], "a": 2, "e": "gzip 產生 logfile.txt.gz 並移除原始檔案。", "s": 17}, {"q": "Which option keeps the original file when compressing with bzip2 or xz?", "o": ["-o", "-k", "-p", "-r"], "a": 1, "e": "獨立壓縮工具預設刪除原始檔案，加上 -k 可保留原始檔案。", "s": 17}, {"q": "Which commands decompress bigfile.txt.xz?", "o": ["bunzip2 bigfile.txt.xz", "unxz bigfile.txt.xz or xz -d bigfile.txt.xz", "gunzip bigfile.txt.xz", "tar -xJf bigfile.txt.xz only"], "a": 1, "e": "xz 檔案以 unxz 或 xz -d 解壓縮；gunzip 用於 .gz，bunzip2 用於 .bz2。", "s": 17}, {"q": "Why must you use tar to compress several files while keeping the directory structure?", "o": ["Standalone compression tools compress only one file at a time", "xz requires a tar archive as input and rejects ordinary files", "gzip cannot compress text files, so tar must convert them first", "bzip2 works only on directories, so single files need tar"], "a": 0, "e": "gzip、bzip2、xz 每次只能壓縮一個檔案；要同時壓縮多個檔案或保留目錄結構需搭配 tar。", "s": 17}, {"q": "Which command shows the uncompressed size of logfile.txt.gz without decompressing it?", "o": ["gzip -l logfile.txt.gz", "tar -tf logfile.txt.gz", "du -h logfile.txt.gz", "gzip -k logfile.txt.gz"], "a": 0, "e": "gzip 與 xz 的 -l 選項可在不解壓縮的情況下查看解壓縮後大小，確認空間是否足夠。", "s": 18}, {"q": "In the gzip -l output, what does the ratio column show?", "o": ["The compression level from 1 to 9", "The compression ratio", "The CPU usage during compression", "The number of files"], "a": 1, "e": "gzip -l 輸出欄位為 compressed、uncompressed、ratio (壓縮比例) 與 uncompressed_name。", "s": 18}, {"q": "In the guided exercise, which archive of /etc was the smallest?", "o": ["/tmp/etc.tar.xz at 4.1M", "/tmp/etc.tar.bz2 at 4.7M", "/tmp/etc.tar.gz at 5.5M", "/tmp/etc.tar at 22M"], "a": 0, "e": "練習中 etc.tar 22M、.gz 5.5M、.bz2 4.7M、.xz 4.1M。", "s": 20}, {"q": "What does the message tar: Removing leading '/' from member names mean?", "o": ["It is normal; tar converted absolute paths to relative paths", "Some files were skipped because their paths were absolute", "You need root permission to archive absolute paths", "The archive is corrupted and must be created again"], "a": 0, "e": "此警告是正常現象，表示 tar 已將絕對路徑轉為相對路徑。", "s": 20}, {"q": "Which command in the guided exercise verifies the file list of the gzip archive?", "o": ["tar -xzf /tmp/etc.tar.gz -C /", "tar -czf /tmp/etc.tar.gz", "tar -tzf /tmp/etc.tar.gz", "gzip -k /tmp/etc.tar.gz"], "a": 2, "e": "-t 列出、-z gzip、-f 檔名，用於驗證 Archive 內容。", "s": 20}, {"q": "After extracting /tmp/etc.tar.gz inside /backuptest, why does /backuptest contain an etc/ directory?", "o": ["Because /etc was moved", "tar stored the members with relative paths", "Because -C was not used", "Because tar always creates a directory named after the archive"], "a": 1, "e": "tar 建立 Archive 時移除了開頭的 /，以相對路徑儲存，因此在目前目錄下解出 etc/。", "s": 21}, {"q": "Which command extracts file.tar and preserves the original permissions?", "o": ["tar -xpf file.tar", "tar -cpf file.tar", "tar -xvf file.tar", "tar -tpf file.tar"], "a": 0, "e": "-x 解壓縮、-p 保留權限、-f 檔名。", "s": 23}, {"q": "Which command creates a gzip-compressed archive of /etc and lists every file that is added?", "o": ["tar -xzvf archive.tar.gz /etc", "tar -czvf archive.tar.gz /etc", "gzip -rv archive.tar.gz /etc", "tar -cjvf archive.tar.gz /etc"], "a": 1, "e": "加上 -v 可以在建立壓縮 Archive 時看到每個被加入的檔案。", "s": 13}, {"q": "Which tar option displays the names of files as they are processed?", "o": ["-f", "-p", "-v", "-l"], "a": 2, "e": "-v (verbose) 顯示處理中的檔案名稱。", "s": 5}, {"q": "Which compression option gives smaller files than gzip but has lower compatibility than gzip?", "o": ["No compression", "-a with .tar", "-j (bzip2)", "-z (gzip)"], "a": 2, "e": "bzip2 壓縮檔較小，但相容性不如 gzip。", "s": 14}, {"q": "Which command extracts only etc/hosts from archive.tar?", "o": ["tar -xf archive.tar etc/hosts", "tar -cf archive.tar etc/hosts", "tar -xf archive.tar /etc/hosts -P", "tar -tf archive.tar etc/hosts"], "a": 0, "e": "在 Archive 檔名後指定成員名稱即可只解壓縮特定檔案；成員以相對路徑 etc/hosts 儲存。", "s": 11}, {"q": "Which command lists the contents of a gzip-compressed archive?", "o": ["tar -tzf file.tar.gz", "tar -xzf file.tar.gz -C /tmp", "tar -czf file.tar.gz", "gzip -t file.tar.gz"], "a": 0, "e": "-t 列出、-z gzip、-f 檔名；列出內容不會解壓縮。", "s": 10}] };</script>
