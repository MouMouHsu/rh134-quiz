<footer class="foot"><div class="wrap">練習題依 RH134 - V10 簡報 (CH16) 編寫，非 Red Hat 官方考題。</div></footer>
<script>window.QUIZ = { key: "CH16", questions: [{"q": "Which installation media contains Anaconda, BaseOS, and AppStream and allows offline installation?", "o": ["Boot ISO", "Source DVD", "Kickstart file", "Binary DVD ISO"], "a": 3, "e": "Binary DVD ISO 包含 Anaconda + BaseOS + AppStream，可離線安裝。", "s": 4}, {"q": "What does the Boot ISO require to complete an installation?", "o": ["Nothing extra, because it already contains all packages", "A USB key that holds the BaseOS and AppStream packages", "A network connection to download packages over HTTP, FTP, or NFS", "A second DVD that contains the BaseOS repository"], "a": 2, "e": "Boot ISO 僅含 Anaconda，需網路下載套件才能完成安裝。", "s": 4}, {"q": "What is the minimum disk space for the installation partition?", "o": ["1.5 GiB", "10 GiB", "20 GiB", "5 GiB"], "a": 1, "e": "最低磁碟需求為 10 GiB (安裝分割區)。", "s": 4}, {"q": "What is the minimum RAM for installing on x86-64 from local media such as USB or DVD?", "o": ["1.5 GiB", "4 GiB", "512 MiB", "3 GiB"], "a": 0, "e": "x86-64/ARM/z14 本地媒體與 NFS 安裝最低 1.5 GiB；HTTP/HTTPS/FTP 安裝需 3 GiB (ARM 4 GiB)。", "s": 4}, {"q": "Which x86 architecture level does RHEL 10 support?", "o": ["x86-64-v2 only", "x86-64-v1", "x86-64-v3", "i686"], "a": 2, "e": "支援架構為 x86-64-v3、ARMv8.0-A、POWER9 與 IBM Z (z14)。", "s": 4}, {"q": "Which tool can create custom RHEL images through composer-cli or the web console?", "o": ["RHEL Image Builder", "ksvalidator", "Anaconda", "dracut"], "a": 0, "e": "RHEL Image Builder 可用 composer-cli 或 Web Console 建立自訂映像。", "s": 4}, {"q": "What is the main Anaconda screen where all installation settings are configured?", "o": ["Initial Setup", "INSTALLATION SUMMARY", "Welcome Screen", "Kickstart Editor"], "a": 1, "e": "Figure 16.1 的 INSTALLATION SUMMARY 是設定所有安裝參數的主介面，需完成必填項目才能開始安裝。", "s": 5}, {"q": "Which RHEL 10 change affects administrator access during installation?", "o": ["Only the root account can be created during installation", "root is disabled by default, so create a wheel user", "User creation is not available in the graphical installer", "SELinux is disabled by default until the first reboot"], "a": 1, "e": "RHEL 10 變更：root 帳戶預設停用，必須建立 wheel 群組使用者才能取得管理權限。", "s": 5}, {"q": "After completing all required items in INSTALLATION SUMMARY, which button starts the installation?", "o": ["Begin Installation", "Reboot System", "Apply Kickstart", "Done"], "a": 0, "e": "完成所有必填項目後點擊 Begin Installation 開始安裝，完成後 Reboot 進入 Initial Setup。", "s": 5}, {"q": "Which kernel parameter enables the RDP remote installation mode in RHEL 10?", "o": ["inst.rdp", "rd.rdp", "inst.vnc", "inst.remote"], "a": 0, "e": "核心參數加入 inst.rdp 啟用 RDP 安裝模式，以 inst.rdp.username 與 inst.rdp.password 認證。", "s": 6}, {"q": "Which remote installation mode does RDP replace because it is deprecated in RHEL 10?", "o": ["Serial console", "Kickstart", "SSH", "VNC"], "a": 3, "e": "RHEL 10 以 RDP 取代已棄用的 VNC 遠端安裝模式，支援多人協作。", "s": 6}, {"q": "During installation, which key combination opens the tmux terminal console?", "o": ["Ctrl+Alt+F6", "Ctrl+Alt+F1", "Ctrl+Alt+Del", "Ctrl+B 2"], "a": 1, "e": "Ctrl+Alt+F1 為 tmux 終端機；Ctrl+Alt+F6 為 Anaconda 圖形介面。", "s": 6}, {"q": "In the installation tmux console, which key sequence switches to a root shell?", "o": ["Ctrl+B 3", "Ctrl+B 0", "Ctrl+B 2", "Ctrl+Alt+F2"], "a": 2, "e": "Ctrl+B 2 為 root shell，Ctrl+B 3 為 /tmp/anaconda.log。", "s": 6}, {"q": "Which log can be viewed with Ctrl+B 3 in the installation tmux console?", "o": ["/var/log/messages", "/var/log/boot.log", "/root/anaconda-ks.cfg", "/tmp/anaconda.log"], "a": 3, "e": "Ctrl+B 3 顯示 /tmp/anaconda.log。", "s": 6}, {"q": "Which key combination returns to the Anaconda graphical interface during installation?", "o": ["Ctrl+Alt+F1", "Ctrl+Alt+F6", "Alt+Tab", "Ctrl+B 1"], "a": 1, "e": "Ctrl+Alt+F6 為 Anaconda 圖形介面。", "s": 6}, {"q": "In the interactive installation guided exercise, how does serverc start the installer?", "o": ["It boots from a USB stick that contains the Boot ISO", "It boots from a Kickstart file stored on a local DVD", "It boots through PXE and selects Install RHEL 10", "It starts the installer from the RHEL web console"], "a": 2, "e": "練習在 serverc 以 Ctrl+Alt+Del 重開機後 PXE Boot，選 Install RHEL 10。", "s": 8}, {"q": "In the interactive installation guided exercise, which software selection is used?", "o": ["Workstation", "Minimal Install", "Custom Operating System", "Server with GUI"], "a": 1, "e": "練習選擇 Minimal Install，啟用 root 並讓 student 具管理權限。", "s": 8}, {"q": "In the guided exercise, which commands verify the installation after reboot?", "o": ["tuned-adm verify", "ksvalidator and ksverdiff", "su - -c id, sudo id, lsblk, and ip addr", "grubby --info ALL"], "a": 2, "e": "Reboot 後以 su - -c id、sudo id、lsblk、ip addr 驗證帳號、分割與網路設定。", "s": 8}, {"q": "In the guided exercise, which NTP server is added in Time & Date?", "o": ["time.redhat.com", "pool.ntp.org", "classroom.example.com", "servera.lab.example.com"], "a": 2, "e": "Configure NTP 移除原條目後新增 classroom.example.com。", "s": 8}, {"q": "What is Kickstart?", "o": ["A text file that answers installation questions", "A graphical installer that replaces Anaconda", "A boot loader that starts the installation media", "A package manager that installs RPMs during setup"], "a": 0, "e": "Kickstart 使用一個文字設定檔自動回答安裝問題，等同於 Windows 的 answer file。", "s": 10}, {"q": "Which Kickstart section specifies packages, groups, or environments to install?", "o": ["%addon ... %end", "%pre ... %end", "%packages ... %end", "%post ... %end"], "a": 2, "e": "%packages 區段指定安裝的套件、群組或環境，以 %end 結束。", "s": 10}, {"q": "In the %packages section, how do you install an environment group?", "o": ["@group-id", "-package", "@^env-group", "env:group"], "a": 2, "e": "@group-id 為套件群組，@^env-group 為環境群組，例如 @^minimal-environment。", "s": 10}, {"q": "In the %packages section, how do you exclude a package?", "o": ["Use exclude=hyperv*", "Prefix it with -, as in -hyperv*", "Prefix it with @", "Prefix it with !, as in !hyperv*"], "a": 1, "e": "以 - 開頭排除指定套件，並可使用萬用字元。", "s": 10}, {"q": "When does the %pre script run, and in which environment?", "o": ["After installation, inside the chroot with all tools available", "Before Anaconda starts, from the boot loader menu", "Before disk partitioning, outside the chroot with fewer tools", "During the first boot of the newly installed system"], "a": 2, "e": "%pre 在磁碟分割前執行、位於 chroot 外，可用工具較少。", "s": 10}, {"q": "When does the %post script run, and in which environment?", "o": ["After installation, inside the chroot", "Before partitioning, outside the chroot with fewer tools", "At every boot of the installed system, as a service", "Only in graphical mode, after the user logs in"], "a": 0, "e": "%post 在安裝完成後執行、位於 chroot 內，可使用完整系統工具。", "s": 10}, {"q": "How does the installer treat lines that begin with # in a Kickstart file?", "o": ["They define package groups", "They are comments and are ignored", "They are commands run as root", "They mark required sections"], "a": 1, "e": "以 # 開頭的行為註解，安裝程式忽略，例如 # version=RHEL10。", "s": 10}, {"q": "Which Kickstart command specifies an HTTP or FTP installation source?", "o": ["repo --boot", "url --url=\"http://server/...\"", "network --url", "source --http"], "a": 1, "e": "url --url 指定 HTTP/FTP 安裝媒體來源；repo 指定額外 DNF 套件庫。", "s": 11}, {"q": "Which Kickstart command removes existing partitions from the specified drives?", "o": ["clearpart --all --drives=vda,vdb", "ignoredisk --clear --drives=vda,vdb", "zerombr --drives=vda,vdb", "part --delete --drives=vda,vdb"], "a": 0, "e": "clearpart 清除磁碟現有分割區。", "s": 11}, {"q": "Which Kickstart command automatically creates root, swap, and boot partitions?", "o": ["part --auto", "clearpart --auto", "autopart", "volgroup --auto"], "a": 2, "e": "autopart 讓 Anaconda 自動決定並建立 root/swap/boot 分割區。", "s": 11}, {"q": "Which Kickstart commands are listed as required in the command section?", "o": ["rootpw, user, firewall, and selinux", "url, repo, text, and autopart", "lang, keyboard, timezone, and bootloader", "firewall, selinux, network, and url"], "a": 2, "e": "lang、keyboard、timezone 與 bootloader 標示為必填；rootpw 為可選。", "s": 11}, {"q": "Which Kickstart command creates a user who is a member of wheel?", "o": ["useradd jdoe -G wheel", "group --name=wheel --add jdoe", "rootpw --wheel jdoe", "user --name=jdoe --groups=wheel"], "a": 3, "e": "user --name 建立使用者，--groups=wheel 給予 sudo 權限。", "s": 11}, {"q": "Which Kickstart command configures the firewall to allow ssh and http?", "o": ["firewall-cmd --add-service=ssh,http", "firewall --enabled --service=ssh,http", "network --firewall=ssh,http", "selinux --service=ssh,http"], "a": 1, "e": "firewall 指令設定防火牆，--service 指定允許的服務。", "s": 11}, {"q": "Which Kickstart command forces a text-mode installation?", "o": ["graphical", "text", "inst.text=0", "cmdline --gui"], "a": 1, "e": "text 強制文字模式安裝；graphical 為圖形模式。", "s": 11}, {"q": "Which Kickstart commands create LVM volume groups and logical volumes?", "o": ["volgroup and logvol, with part pv.01 for the PV", "autopart --lvm only, because manual LVM is not allowed", "lvm --vg and lvm --lv, with part lvm.01 for the PV", "lvcreate and vgcreate, the same as on a running system"], "a": 0, "e": "volgroup／logvol 搭配 part pv.01 建立 LVM VG 與 LV。", "s": 11}, {"q": "In the example Kickstart file, what does ignoredisk --only-use=vda do?", "o": ["It ignores the vda disk and installs on the other disks", "It sets vda as a dedicated swap device for the system", "It formats all disks except vda during the installation", "It limits the installation to the vda disk"], "a": 3, "e": "ignoredisk --only-use=vda 限制只使用 vda，避免誤改其他磁碟。", "s": 12}, {"q": "In the example Kickstart file, what does rootpw --iscrypted --allow-ssh do?", "o": ["Sets an encrypted root password and allows root SSH", "Disables the root account", "Locks root and allows SSH for all users", "Sets a plain-text password"], "a": 0, "e": "--iscrypted 使用加密密碼，--allow-ssh 允許 SSH。", "s": 12}, {"q": "What does %addon com_redhat_kdump --enable --reserve-mb='auto' configure?", "o": ["SELinux relabeling during the first boot", "The kernel crash dump mechanism", "The RDP remote installer and its credentials", "Automatic updates after the installation completes"], "a": 1, "e": "%addon com_redhat_kdump 設定 Kernel crash dump 機制。", "s": 12}, {"q": "In the example Kickstart file, what does the %post section do?", "o": ["It writes a Kickstarted on date message to /etc/motd", "It installs vim-enhanced after the base packages", "It sets the time zone from the system clock", "It partitions the disk after the packages are installed"], "a": 0, "e": "%post 內容為 echo \"Kickstarted on $(date)\" > /etc/motd。", "s": 12}, {"q": "Which tool checks a Kickstart file for syntax errors?", "o": ["anaconda --check", "ksverdiff", "kscheck", "ksvalidator"], "a": 3, "e": "ksvalidator 驗證語法，語法正確時無輸出，錯誤時顯示如 Unknown command: frewall。", "s": 13}, {"q": "What does ksverdiff -f RHEL9 -t RHEL10 show?", "o": ["The installed files that differ between two RHEL systems", "The package differences between the RHEL 9 and RHEL 10 repositories", "The kernel parameter changes between the RHEL 9 and RHEL 10 kernels", "Kickstart syntax changes from RHEL 9 to RHEL 10"], "a": 3, "e": "ksverdiff 比較版本差異，例如已移除 auth、authconfig、autostep、btrfs，已棄用 vnc。", "s": 13}, {"q": "Which package provides ksvalidator and ksverdiff?", "o": ["lorax", "anaconda-tools", "kickstart-utils", "pykickstart"], "a": 3, "e": "pykickstart 套件提供 ksvalidator 與 ksverdiff。", "s": 13}, {"q": "Which file is generated automatically after each installation and is a good starting point for a Kickstart file?", "o": ["/etc/kickstart.cfg", "/tmp/anaconda.log", "/var/lib/anaconda/ks.cfg", "/root/anaconda-ks.cfg"], "a": 3, "e": "/root/anaconda-ks.cfg 是每次安裝後自動產生的起點。", "s": 13}, {"q": "What are the three steps of the Kickstart deployment workflow?", "o": ["Validate the file, encrypt it, then sign it", "Boot the installer, partition the disks, then reboot", "Install the system, relabel SELinux, then update packages", "Create the file, publish it, then boot the installer with it"], "a": 3, "e": "Figure 16.3 三步驟部署流程為建立、發佈、啟動。", "s": 13}, {"q": "In the Kickstart guided exercise, which command disables Initial Setup after installation?", "o": ["initial-setup off", "skipx", "firstboot --disable", "%post systemctl disable firstboot"], "a": 2, "e": "練習在 kickstart.cfg 加入 firstboot --disable 停用 Initial Setup。", "s": 15}, {"q": "In the Kickstart guided exercise, where is kickstart.cfg published?", "o": ["/srv/nfs on serverb, shared with NFS", "/root/ on workstation, copied over SSH", "/etc/ on serverc, read during the PXE boot", "/var/www/html/ on servera, served over HTTP"], "a": 3, "e": "以 sudo cp kickstart.cfg /var/www/html/ 透過 servera 的 HTTP 發佈。", "s": 15}, {"q": "Which boot parameter tells the installer where to find the Kickstart file in the guided exercise?", "o": ["inst.ks=http://servera.lab.example.com/kickstart.cfg", "inst.rdp=http://servera.lab.example.com/kickstart.cfg", "kickstart=servera.lab.example.com/kickstart.cfg", "ks.file=/kickstart.cfg on the PXE boot line"], "a": 0, "e": "在 PXE 選單選 Install RHEL 10 按 Tab，行末加 inst.ks=http://servera.lab.example.com/kickstart.cfg。", "s": 15}, {"q": "In the Kickstart guided exercise, which %packages entries are used?", "o": ["@^minimal-environment, @guest-agents, and vim-enhanced", "@^server-with-gui, httpd, and vim-enhanced", "@^workstation-product-environment and vim-enhanced", "@base, @guest-agents, and -vim*"], "a": 0, "e": "%packages 更新為 @^minimal-environment、@guest-agents、vim-enhanced。", "s": 15}, {"q": "In the Kickstart guided exercise, what does the %post script add?", "o": ["It installs httpd and starts it on the first boot", "It runs mandb and appends a Kickstarted on date line to /etc/issue", "It creates a swap file and enables it in /etc/fstab", "It disables SELinux and writes a message to /etc/motd"], "a": 1, "e": "%post 內容為 mandb 與 echo \"Kickstarted on $(date +%F)\" >> /etc/issue。", "s": 15}, {"q": "In the example Kickstart file, what does zerombr do together with clearpart --all --initlabel?", "o": ["It installs GRUB2 to the MBR before the disks are partitioned", "It disables the boot loader so that the disk boots from PXE", "It creates a zero-size partition at the start of each disk", "It lets the installer initialize and clear disks without prompting"], "a": 3, "e": "範例中 zerombr、clearpart --all --initlabel 與 autopart 一起使用，清除並初始化磁碟後自動分割。", "s": 12}, {"q": "Which installation method needs more RAM: local media or HTTP/HTTPS/FTP network installation?", "o": ["HTTP/HTTPS/FTP network installation", "They need the same RAM", "NFS installation", "Local media"], "a": 0, "e": "x86-64 本地媒體與 NFS 安裝需 1.5 GiB，HTTP/HTTPS/FTP 需 3 GiB (ARM 4 GiB)。", "s": 4}] };</script>
