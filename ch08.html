<script>window.QUIZ = { key: "CH08", questions: [{"q": "Which package provides sftp?", "o": ["nfs-utils", "rsync", "vsftpd", "OpenSSH"], "a": 3, "e": "SFTP 是 OpenSSH 套件的一部分，提供互動式的加密檔案上傳與下載。", "s": 4}, {"q": "Which command opens an interactive SFTP session as remoteuser on remotehost?", "o": ["sftp -r remotehost remoteuser", "sftp remoteuser@remotehost", "ssh -sftp remoteuser remotehost", "scp remoteuser@remotehost"], "a": 1, "e": "連線語法為 sftp [user@]remotehost，連線後進入 sftp> 提示符號。", "s": 4}, {"q": "If you omit user@ in a remote location such as host:path, which user name is used?", "o": ["root", "anonymous", "The current local user name", "The user named in /etc/hosts"], "a": 2, "e": "遠端位置使用 user@host:path 格式；省略 user@ 時使用當前本地使用者。", "s": 4}, {"q": "How is data protected during an SFTP transfer?", "o": ["It sends data in clear text over port 21", "It encrypts only the password", "It uses SSH authentication and encrypts all data", "It relies on SELinux labels"], "a": 2, "e": "SFTP 使用 SSH 的安全認證機制，所有資料傳輸均加密。", "s": 4}, {"q": "In an sftp session, which command changes the directory on the local host?", "o": ["cd path", "lcd path", "lpwd path", "chdir -l path"], "a": 1, "e": "加 l 前綴的指令 (lpwd、lcd、lls、lmkdir) 作用於本地 Host；無 l 前綴作用於遠端 Host。", "s": 5}, {"q": "In an sftp session, which command displays the current directory on the remote host?", "o": ["pwd", "lpwd", "rpwd", "lls"], "a": 0, "e": "pwd 顯示遠端目前目錄，lpwd 顯示本地目前目錄。", "s": 5}, {"q": "In an sftp session, which command uploads a directory recursively?", "o": ["put -r dir", "lput dir", "mput dir", "get -r dir"], "a": 0, "e": "put -r 遞迴上傳目錄，get -r 遞迴下載目錄。", "s": 5}, {"q": "Which commands end an sftp session?", "o": ["close or stop", "quit -f or logout", "exit or bye", "Ctrl+Z"], "a": 2, "e": "exit 或 bye 結束 sftp 工作階段。", "s": 5}, {"q": "Which sftp command lists the contents of the local directory?", "o": ["lpwd", "lls", "ls", "dir -l"], "a": 1, "e": "lls 列出本地目錄內容；ls 列出遠端目錄內容。", "s": 5}, {"q": "Where does sftp> put /etc/hosts place the file after cd hostbackup?", "o": ["In the local hostbackup directory, because put copies locally", "In /tmp on the remote host, because uploads go there first", "In /etc/hosts on the remote host, replacing the remote file", "In /home/remoteuser/hostbackup/hosts on the remote host"], "a": 3, "e": "put 上傳到遠端目前目錄，輸出顯示 Uploading /etc/hosts to /home/remoteuser/hostbackup/hosts。", "s": 6}, {"q": "Where does sftp> get /etc/dnf/dnf.conf save the file?", "o": ["In the remote home directory", "In /tmp/dnf.conf", "In /etc/dnf/ on the local host", "In the local current directory"], "a": 3, "e": "get 下載到本地目前目錄，輸出顯示 Fetching /etc/dnf/dnf.conf to dnf.conf。", "s": 6}, {"q": "What can the single-line command sftp remoteuser@remotehost:/home/remoteuser/remotefile do?", "o": ["Download the file; uploads need an interactive session", "Delete the remote file after showing its size and path", "Upload and download files in a single non-interactive command", "Only list the remote file without transferring its contents"], "a": 0, "e": "單行語法只能用於下載 (get)，上傳 (put) 必須使用互動式工作階段。", "s": 6}, {"q": "How does scp differ from sftp?", "o": ["scp provides an interactive prompt", "scp does not encrypt data", "scp is not part of OpenSSH", "scp copies files non-interactively"], "a": 3, "e": "scp 也是 OpenSSH 套件的一部分，可在本地與遠端系統之間非互動式地複製檔案。", "s": 8}, {"q": "Which command copies /etc/dnf/dnf.conf and /etc/hosts to /home/remoteuser on remotehost?", "o": ["sftp /etc/dnf/dnf.conf /etc/hosts remotehost", "scp remoteuser@remotehost:/home/remoteuser /etc/dnf/dnf.conf /etc/hosts", "scp /etc/dnf/dnf.conf /etc/hosts remoteuser@remotehost:/home/remoteuser", "scp -r /etc remoteuser@remotehost"], "a": 2, "e": "scp 語法為 scp [options] source destination，可指定多個來源，最後一個參數為目的地。", "s": 8}, {"q": "Which command recursively copies /etc/ssh from serverb to ~/serverbackup2?", "o": ["scp root@serverb:/etc/ssh ~/serverbackup2", "sftp -r root@serverb /etc/ssh", "scp -r root@serverb:/etc/ssh ~/serverbackup2", "scp -r ~/serverbackup2 root@serverb:/etc/ssh"], "a": 2, "e": "-r 遞迴複製目錄，來源為遠端 root@serverb:/etc/ssh。", "s": 8}, {"q": "In RHEL 10, which protocol does the scp command use by default?", "o": ["The legacy SCP protocol", "SFTP", "FTP", "rsync"], "a": 1, "e": "RHEL 10 起 scp 指令預設改用 SFTP 協議傳輸檔案，不再使用傳統 SCP 協議。", "s": 9}, {"q": "Which scp option falls back to the legacy SCP protocol?", "o": ["-L", "-O", "-S", "-1"], "a": 1, "e": "-O 回退至傳統 SCP 協議，但 Red Hat 不建議使用。", "s": 9}, {"q": "What is the effect of the /etc/ssh/disable_scp file?", "o": ["SCP is disabled and -O fails, but SFTP still works", "Both scp and sftp stop working until the file is removed", "Only the root user can still use scp, and only with -O", "The scp command is removed from the system completely"], "a": 0, "e": "若存在 /etc/ssh/disable_scp，SCP 協議完全停用且 -O 無效，但 SFTP 與 sftp 指令仍可正常使用。", "s": 9}, {"q": "Why does Red Hat not recommend using the legacy SCP protocol?", "o": ["It requires a graphical session to enter passwords", "It is slower than FTP and does not support compression", "It cannot copy directories, even with the -r option", "It has a code injection vulnerability (CVE-2020-15778)"], "a": 3, "e": "傳統 SCP 協議存在程式碼注入漏洞 (CVE-2020-15778)。", "s": 9}, {"q": "What do SFTP and SCP transfers have in common?", "o": ["Both are based on OpenSSH and encrypt data during transfer", "Both open an interactive prompt for each transfer", "Both need an NFS server running on the remote host", "Both use port 21 and send data without encryption"], "a": 0, "e": "兩者皆基於 OpenSSH，資料傳輸全程加密。", "s": 10}, {"q": "In the Transfer Files guided exercise, why is the SFTP session opened as root@serverb?", "o": ["Only root can read all of the contents of /etc/ssh", "scp does not work for student", "student cannot use sftp", "root is required to write to the local home directory"], "a": 0, "e": "只有 root 可讀取 /etc/ssh 的全部內容，因此以 root 連線。", "s": 12}, {"q": "In the guided exercise, which steps download /etc/ssh into /home/student/serverbackup1 in sftp?", "o": ["cd /home/student/serverbackup1/ then put -r /etc/ssh", "lcd /etc/ssh then get -r serverbackup1", "get /etc/ssh /home/student/serverbackup1", "lcd /home/student/serverbackup1/ then get -r /etc/ssh"], "a": 3, "e": "先以 lcd 切換本地目錄，再以 get -r 遞迴下載。", "s": 12}, {"q": "Which command creates the two backup directories in the guided exercise?", "o": ["mkdir -r ~/serverbackup1,2", "mkdir ~/serverbackup1 + 2", "mkdir ~/serverbackup{1,2}", "mkdir ~/serverbackup[1-2]"], "a": 2, "e": "Brace Expansion {1,2} 展開為 serverbackup1 與 serverbackup2。", "s": 12}, {"q": "How does rsync make repeated synchronizations efficient?", "o": ["It always compresses the entire directory", "It copies only files newer than one day", "It uses multicast", "It copies only the parts that differ"], "a": 3, "e": "rsync 採用差異演算法，只複製兩系統間有差異的檔案部分；首次同步傳輸全部內容，後續只傳輸變更。", "s": 14}, {"q": "Which command synchronizes the local /var/log directory to /tmp on hosta?", "o": ["rsync -av hosta:/tmp /var/log", "rsync -av /var/log hosta:/tmp", "scp -av /var/log hosta:/tmp", "rsync -n /var/log hosta"], "a": 1, "e": "rsync [options] source destination，本地到遠端時目的地為 hosta:/tmp。", "s": 14}, {"q": "Which rsync option simulates the synchronization without transferring files?", "o": ["-H (--hard-links)", "-n (--dry-run)", "-a (--archive)", "-v (--verbose)"], "a": 1, "e": "-n 乾跑模式模擬執行，建議正式執行前先用 -n 驗證將發生的變更。", "s": 15}, {"q": "Which options are combined in rsync archive mode (-a)?", "o": ["-rlptgoDH", "-rlptgoD", "-rvn", "-rAXH"], "a": 1, "e": "-a 等同 -r -l -p -t -g -o -D，保留目錄結構、符號連結、權限、時間戳記、群組、擁有者與裝置檔案。", "s": 16}, {"q": "Which attribute is NOT preserved by rsync archive mode (-a)?", "o": ["Timestamps", "Hard links", "Symbolic links", "Permissions"], "a": 1, "e": "封存模式不保留硬式連結，需額外加上 -H (--hard-links)。", "s": 16}, {"q": "In rsync archive mode, what does -l do?", "o": ["Limits bandwidth", "Preserves ACLs", "Synchronizes symbolic links", "Lists files without copying"], "a": 2, "e": "-l (--links) 同步符號連結。", "s": 16}, {"q": "Which rsync option preserves file owners?", "o": ["-D", "-p", "-g", "-o"], "a": 3, "e": "-o (--owner) 保留檔案擁有者，-g 保留群組，-p 保留權限，-D 保留裝置檔案。", "s": 16}, {"q": "Which rsync option preserves ACLs?", "o": ["-X", "-a", "-A", "-H"], "a": 2, "e": "-A (--acls) 保留 Access Control Lists。", "s": 17}, {"q": "Which rsync option preserves extended attributes such as SELinux file contexts?", "o": ["-X", "-A", "-x", "-S"], "a": 0, "e": "-X (--xattrs) 同步時保留延伸屬性，確保 Security Context 不遺失。", "s": 17}, {"q": "Which command performs a backup that keeps archive attributes plus ACLs and extended attributes?", "o": ["rsync -nH /source /dest", "rsync -r /source /dest", "rsync -aAX /source /dest", "rsync -av /source /dest"], "a": 2, "e": "rsync -aAX 結合封存模式、ACL 與延伸屬性，是保留所有屬性的完整備份指令。", "s": 17}, {"q": "What is the trade-off of adding -H to rsync?", "o": ["It preserves hard links but can increase synchronization time", "It skips hidden files and directories during the sync", "It removes files from the source after they are copied", "It disables encryption to make the transfer faster"], "a": 0, "e": "-H 可補足封存模式不保留硬式連結的缺口，但可能增加同步所需時間。", "s": 17}, {"q": "What does a trailing slash on the rsync source path change?", "o": ["Whether rsync uses SSH or a local copy for the transfer", "Whether hard links are preserved in the destination", "Whether rsync synchronizes the directory itself or only its contents", "Whether the destination directory is deleted before copying"], "a": 2, "e": "來源路徑是否加上尾部斜線決定同步的是目錄本身，還是目錄內容。", "s": 19}, {"q": "Does a trailing slash on the rsync destination path affect the result?", "o": ["Yes; it deletes extra files", "Only for remote destinations", "No; only the source path matters", "Yes; it creates an extra subdirectory"], "a": 2, "e": "目的地路徑不受此規則影響，只有來源路徑的尾部斜線才有作用。", "s": 19}, {"q": "Why should you be careful when using Bash Tab completion for an rsync source directory?", "o": ["Tab completion removes the directory name from the source path", "Tab completion replaces the source with the destination path", "Tab completion adds the -n option, so nothing is copied", "Tab adds a trailing slash, so only the contents are copied"], "a": 3, "e": "Bash Tab 補全會自動加上 /，即為有尾部斜線的行為。", "s": 19}, {"q": "To preserve file owners on the destination, how must rsync be run?", "o": ["As root on the destination, or with sudo locally", "As any user, because the -o option keeps owners by itself", "As any user, as long as the -n option is used first", "As any user, as long as the -H option is added"], "a": 0, "e": "若要在目的端保留檔案擁有者，必須以 root 身分執行；遠端目的地需以 root 登入，本地則使用 sudo。", "s": 20}, {"q": "Which command synchronizes /var/log from hosta to the local /tmp directory?", "o": ["rsync -av /tmp hosta:/var/log", "rsync -av /var/log hosta:/tmp", "rsync hosta /var/log /tmp", "rsync -av hosta:/var/log /tmp"], "a": 3, "e": "遠端到本地時來源為 hosta:/var/log，目的地為 /tmp。", "s": 20}, {"q": "In the rsync guided exercise, what does the speedup value of 1.00 in the first run indicate?", "o": ["The first run copied everything, so there was no gain", "rsync failed to connect and copied nothing on the first run", "Only one file was copied because the destination already existed", "The network was slow, so rsync could not use compression"], "a": 0, "e": "首次全量同步 speedup 為 1.00；第二次差異同步只傳 log/messages 與 audit.log，speedup 達 178.30。", "s": 22}, {"q": "In the rsync guided exercise, which command creates a change before the second synchronization?", "o": ["touch /var/log to update the directory timestamp", "logger \"Log files synchronized\"", "rsync -n /var/log to mark files as changed", "journalctl --flush to rewrite the journal files"], "a": 1, "e": "logger 寫入一筆 Log，使 /var/log/messages 產生變更，再次同步時只傳輸變更部分。", "s": 22}, {"q": "In the rsync guided exercise, which files are transferred in the second run?", "o": ["Only the changed files, such as log/messages and audit.log", "No files, because rsync skips directories it copied before", "All files in /var/log again, because rsync copies everything", "Only new directories, because existing files are never updated"], "a": 0, "e": "差異同步只傳輸有變更的檔案，練習中為 log/messages 與 audit.log。", "s": 22}, {"q": "What is the most common rsync option combination mentioned in the course?", "o": ["-rX", "-av", "-Dz", "-nH"], "a": 1, "e": "rsync -av 為封存模式加詳細輸出，是最常見的組合。", "s": 15}, {"q": "What does the -v option of rsync show?", "o": ["Only the errors that occur while files are transferred", "Each transferred file name and the transfer speed", "The files that will be deleted from the destination", "The version of rsync on both the source and destination"], "a": 1, "e": "-v 詳細輸出，顯示每個被傳輸的檔案名稱與速度，有助於監控進度與排查問題。", "s": 15}, {"q": "In an sftp session, which command creates a directory on the remote host?", "o": ["lmkdir dir", "mkdir dir", "md -r dir", "put -d dir"], "a": 1, "e": "mkdir 在遠端建立目錄，lmkdir 在本地建立目錄。", "s": 5}, {"q": "Which sftp command downloads a directory and its contents recursively?", "o": ["put -r directory", "get directory/*", "get -r directory", "mget -a directory"], "a": 2, "e": "get -r 遞迴下載目錄。", "s": 6}, {"q": "Which rsync archive mode option preserves timestamps?", "o": ["-T", "-l", "-p", "-t"], "a": 3, "e": "-t (--times) 保留時間戳記。", "s": 16}, {"q": "Which command synchronizes /var/log into /tmp on the same host while preserving owners?", "o": ["rsync -n /var/log /tmp", "rsync -av /tmp /var/log", "scp -r /var/log /tmp", "sudo rsync -av /var/log /tmp"], "a": 3, "e": "本地到本地同步時，要保留擁有者需以 sudo 執行。", "s": 14}, {"q": "In the Transfer Files guided exercise, how do you compare the two copies of /etc/ssh?", "o": ["Run ls -lR on ~/serverbackup1 and ~/serverbackup2", "Run rsync -n between the two backup directories", "Run sftp ls on serverb to list the original files", "Run diff on /etc/ssh on servera and serverb"], "a": 0, "e": "以 ls -lR 列出兩個備份目錄，比較 sftp 與 scp 兩種方式複製的目錄結構是否一致。", "s": 12}, {"q": "When /etc/ssh/disable_scp exists, can you still transfer files with the sftp command?", "o": ["Yes; only the SCP protocol is disabled", "Only with scp -O", "No; all SSH file transfers are disabled", "Only as root"], "a": 0, "e": "disable_scp 只停用 SCP 協議並使 -O 無效，SFTP 仍可正常運作。", "s": 9}] };</script>
